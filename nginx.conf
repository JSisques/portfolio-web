server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Astro emits content-hashed filenames under /_astro/ — safe to cache
    # forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Locale roots (/ and /en) build to <root>/index.html and
    # <root>/en/index.html; trailingSlash is "never" so both the bare and
    # slash-trailing form need to resolve to the same file.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
